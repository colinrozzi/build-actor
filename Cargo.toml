[package]
name = "build-actor"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
base64 = "0.21"
wit-bindgen-rt = { version = "0.39.0", features = ["bitflags"] }
hex = "0.4"
glob = "0.3"

[lib]
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
lto = true

[package.metadata.component]
package = "ntwk:theater"

[package.metadata.component.dependencies]
